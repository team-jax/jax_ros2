# camera_to_robot of vision_node: p_robot = R · p_cam + t, R = Rz(yaw)·Ry(pitch)·Rx(roll).
# [tx, ty, tz (m), roll, pitch, yaw (deg)]
# *** 미검증 임시값 (CAD 기준, 실물 보정 전까지) ***
#   위치: 기준점 P (-28, -117.7, 838.02) 와 어깨 롤축 점 R0 (-202, 0, 850) 의 차이 (+174, -117.7, -11.98) mm.
#         CAD 축 대응 X = 로봇 왼쪽, Y = 뒤, Z = 위 -> t = (0.174, -0.1177, -0.012).
#         기준점 정정 (2026-11-14): 이전에는 꼭짓점 V (-28, -146.0, 866.3) 를 썼다. 사용자가 잰 "프로파일 뒷면~거치대 우측 아래 꼭짓점
#         15.77 cm", 준영의 "바닥~카메라 지지대 1200.52 mm", 정우 CAMERA.md의 "프로파일 중심선 앞 117.7 mm" 가 모두 P를 가리킨다.
#         V는 P에서 45° 경사선을 따라 40 mm 위로 올라간 다른 꼭짓점이다.
#         렌즈가 P에서 경사선을 따라 올라간 거리 s (0~40 mm) 는 아직 모른다 -> 반영하지 않았다.
#   회전: IMU (pitch -45.1, 폰 가로 장착, 뒤집힘) -> roll 135.129, pitch 0.988, yaw 0.992 (이전과 같음).
#         회전 [135.129, 0.988, 0.992] = 바로 선 45° 아래 기준 [-135, 0, 180] × 광축 기준 180° 회전(폰이 뒤집혀 장착됨).
#         정책 관측 쪽에서 광학 좌표를 R_OPT에 넣을 때는 먼저 (x,y,z) -> (-x,-y,z)로 바꿀 것.
#   검증: cam (0,0,0.45) -> (0.174,-0.4352,-0.3308), cam (0.1,0,0.45) -> (0.274,-0.4335,-0.3326),
#         cam (0,0.1,0.45) -> (0.1764,-0.5061,-0.2603) (오차 1e-3 이내, tests/check_camera_result.py).
#         책상 높이(z -0.4525)와 맞는지는 확인하지 않았다(이전 큐브 판독 cam (0.0045,-0.0399,0.4981) 이면 z 약 -0.393).
# 폐기: [0.174, -0.146, 0.016, 135.129, 0.988, 0.992] (기준점 V), [-0.146, -0.174, -0.0715, ...], [-0.146, -0.174, 0.016, ...],
#       [-0.045, -0.335, -0.027, 180.0, 0.0, 180.0] (수직 가정), [0.053520, -0.144755, -0.040330, 143.734621, -5.557579, -1.390309] (손 측정)
vision_node:
  ros__parameters:
    camera_to_robot: [0.174, -0.1177, -0.012, 135.129, 0.988, 0.992]
