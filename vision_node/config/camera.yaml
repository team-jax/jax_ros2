# camera_to_robot of vision_node: p_robot = R · p_cam + t, R = Rz(yaw)·Ry(pitch)·Rx(roll).
# [tx, ty, tz (m), roll, pitch, yaw (deg)]
# 2026-11-12, 설치 사실 + CAD 기반(손 측정 아님):
#   폰은 거치대에 몸통 옆 45° 아래 정면을 보며 끼워져 있고 위아래가 뒤집혀 있음
#   (IMU pitch -45.1, roll -1.0, up_cam1 (-0.017, 0.705, -0.709)).
#   렌즈 위치: CAD에서 어깨 롤축 기준 앞 17.4 cm, 로봇 오른쪽 14.6 cm, 위 1.6 cm -> t = (-0.146, -0.174, 0.016).
#   검증: cam (0,0,0.45) -> (-0.146,-0.4915,-0.3029), cam (0.1,0,0.45) -> (-0.046,-0.4898,-0.3046),
#         cam (0,0.1,0.45) -> (-0.1436,-0.5624,-0.2323) (오차 1e-3 이내, tests/check_camera_result.py).
#   실측으로 확인하지 않은 값이다(CAD 위치·IMU 자세 그대로).
# 폐기: [-0.045, -0.335, -0.027, 180.0, 0.0, 180.0] (카메라 수직 가정), [0.053520, -0.144755, -0.040330, 143.734621, -5.557579, -1.390309] (손 측정, 9.4 cm 오차)
vision_node:
  ros__parameters:
    camera_to_robot: [-0.146, -0.174, 0.016, 135.129, 0.988, 0.992]
