# camera_to_robot of vision_node: p_robot = R · p_cam + t, R = Rz(yaw)·Ry(pitch)·Rx(roll).
# [tx, ty, tz (m), roll, pitch, yaw (deg)]
# *** 미검증 임시값 (2026-11-12 기준 CAD, 실물 보정 전까지) ***
#   위치: CAD 어깨 롤축 점 (-202, 0, 850) 과 거치대 꼭짓점 (-28, -145.998, 866.304) 의 차이 (+174, -146, +16.3) mm.
#         CAD 축 대응 X = 로봇 왼쪽, Y = 뒤, Z = 위 -> t = (0.174, -0.146, 0.016).
#         렌즈-꼭짓점 오프셋은 반영하지 않았다.
#   회전: IMU (pitch -45.1, 폰 가로 장착, 뒤집힘) -> roll 135.129, pitch 0.988, yaw 0.992.
#   검증: cam (0,0,0.45) -> (0.174,-0.4635,-0.3026), cam (0.1,0,0.45) -> (0.274,-0.4618,-0.3043),
#         cam (0,0.1,0.45) -> (0.1764,-0.5344,-0.2320) (오차 1e-3 이내, tests/check_camera_result.py).
#         책상 높이(z -0.4525)와 맞는지는 확인하지 않았다(이전 큐브 판독 기준으로는 z가 약 -0.365로 나온다).
# 폐기: [-0.146, -0.174, -0.0715, 135.129, 0.988, 0.992] (x·y 뒤바뀜, tz 판독 보정),
#       [-0.146, -0.174, 0.016, 135.129, 0.988, 0.992], [-0.045, -0.335, -0.027, 180.0, 0.0, 180.0] (수직 가정),
#       [0.053520, -0.144755, -0.040330, 143.734621, -5.557579, -1.390309] (손 측정, 9.4 cm 오차)
vision_node:
  ros__parameters:
    camera_to_robot: [0.174, -0.146, 0.016, 135.129, 0.988, 0.992]
