# camera_to_robot of vision_node: p_robot = R · p_cam + t, R = Rz(yaw)·Ry(pitch)·Rx(roll).
# [tx, ty, tz (m), roll, pitch, yaw (deg)]
# 2026-11-12, 설치 사실 + CAD + 큐브 판독 보정(손으로 점을 재서 푼 값 아님):
#   카메라는 몸통 옆 머리 거치대에 45° 아래 정면을 보며 끼워져 있고 폰은 위아래가 뒤집혀 있음
#   (IMU pitch -45.1, up_cam1 (-0.017, 0.705, -0.709)) -> roll 135.129, pitch 0.988, yaw 0.992.
#   위치: CAD 기준 어깨 롤축에서 앞 17.4 cm, 로봇 오른쪽 14.6 cm -> tx -0.146, ty -0.174.
#   tz = -0.0715: 실제 큐브 판독(z -0.365)을 책상 높이 -0.4525에 맞추려고 정한 값(CAD 값 0.016이 아님).
#   검증: cam (0,0,0.45) -> (-0.146,-0.4915,-0.3904), cam (0.1,0,0.45) -> (-0.046,-0.4898,-0.3921),
#         cam (0,0.1,0.45) -> (-0.1436,-0.5624,-0.3198), cam (0.0045,-0.0399,0.4981) -> z -0.4527
#         (오차 1e-3 이내, tests/check_camera_result.py).
#   tz는 큐브 한 번 판독으로 맞춘 값이라 다른 위치·깊이에서 같은 오차가 남는다는 보장이 없다.
# 폐기: [-0.146, -0.174, 0.016, 135.129, 0.988, 0.992] (tz = CAD), [-0.045, -0.335, -0.027, 180.0, 0.0, 180.0] (수직 가정),
#       [0.053520, -0.144755, -0.040330, 143.734621, -5.557579, -1.390309] (손 측정, 9.4 cm 오차)
vision_node:
  ros__parameters:
    camera_to_robot: [-0.146, -0.174, -0.0715, 135.129, 0.988, 0.992]
