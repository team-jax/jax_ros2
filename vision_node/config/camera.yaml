# camera_to_robot of vision_node: p_robot = R · p_cam + t, R = Rz(yaw)·Ry(pitch)·Rx(roll).
# [tx, ty, tz (m), roll, pitch, yaw (deg)]
# 계산식 값(손 측정 아님), 2026-11-12: 카메라를 책상 위에 수직(위에서 아래로) 고정한다는 가정.
#   렌즈 위치 (-0.045, -0.335, -0.027) m = 작업영역 중앙 위, 책상 위 45 cm (책상면 z = -0.477 m).
#   광축 수직 아래, 이미지 위쪽 = 로봇 앞쪽(-y). R = diag(-1, 1, -1) = Rz(180)·Rx(180) -> roll 180, pitch 0, yaw 180.
#   검증: cam (0,0,0.45) -> (-0.045,-0.335,-0.477), cam (0.1,0,0.45) -> (-0.145,-0.335,-0.477),
#         cam (0,0.1,0.45) -> (-0.045,-0.235,-0.477) (tests/check_camera_result.py).
#   실제 장착 위치·수직도가 이 가정과 다르면 이 값도 틀린다(실측으로 확인하지 않았다).
# 폐기: 이전 손 측정 값 [0.053520, -0.144755, -0.040330, 143.734621, -5.557579, -1.390309] (9.4 cm 오차, 측정 불일치)
vision_node:
  ros__parameters:
    camera_to_robot: [-0.045, -0.335, -0.027, 180.0, 0.0, 180.0]
