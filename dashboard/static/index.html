<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAX 팔 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/rl.css">
<script type="importmap">
{ "imports": { "three": "/static/vendor/three-0.160.0/three.module.js",
               "three/addons/": "/static/vendor/three-0.160.0/" } }
</script>
</head>
<body>
<header class="topbar">
  <div class="brand">JAX <b>팔</b> <span class="vbadge" id="brand-virtual" hidden>가상</span></div>
  <div class="chips">
    <span class="chip" id="chip-ws"><span class="dot"></span>연결 중</span>
    <span class="chip" id="chip-ros"><span class="dot"></span>ROS</span>
    <button class="btn line small" id="btn-ros" title="ROS 를 source 한 자식 프로세스로 구독 (다시) 시작">ROS 연결(source)</button>
    <span class="chip" id="chip-can"><span class="dot"></span>can0</span>
    <span class="chip" id="chip-run"><span class="dot"></span>실행 0</span>
  </div>
  <div class="modesw" role="group" aria-label="모드">
    <button id="mode-real" title="실물 로봇">실물</button>
    <button id="mode-virtual" title="가상 팔: 실물·CAN·ROS 없이">가상</button>
  </div>
  <div class="spacer"></div>
  <button class="btn-stop" id="btn-stop" title="켜진 항목 전부 끄기 (Esc)">■ 전부 정지<small>모든 노드 끄기 · Esc</small></button>
  <div class="phaseline" id="phaseline" hidden aria-live="polite"></div><!-- 재생 중 '지금 무슨 동작' (play_phase, 어느 탭에서든) -->
</header>
<div class="warnbar" id="warnbar">⚠ 전부 정지 = 노드 종료 → 실물은 <b>팔이 떨어질 수 있다.</b> 먼저 팔을 받친다.</div>
<div class="virtbar" id="virtbar" hidden>가상 모드 — 실물 모터와 상관없는 가상 팔</div>
<div class="warnbar" id="suggestbar" hidden></div>
<div class="warnbar bad" id="straybar" hidden></div>
<nav class="tabs" id="tabs" role="tablist"></nav>
<main class="main">
  <!-- 1. 연결 -->
  <section class="page" id="page-conn" data-tab="conn">
    <h2 class="sec">순서대로 켜기 <small id="conn-note"></small></h2>
    <div class="steps3" id="conn-steps"></div>
    <h2 class="sec">AK45 <small id="ros-note"></small></h2>
    <div id="motors"></div>
    <details class="adv" id="conn-adv">
      <summary>고급 — 노드 따로 켜기 · 로그 · 보정 · 시험</summary>
      <div class="grid" id="conn-ros"></div>
      <h2 class="sec">노드 따로 켜기 / 끄기</h2>
      <div class="grid" id="svc-conn"></div>
      <h2 class="sec">보정 (calibrate)</h2>
      <div class="grid" id="calib"></div>
    </details>
  </section>
  <!-- 2. 각도 제어 -->
  <section class="page" id="page-angle" data-tab="angle">
    <div class="split">
      <div class="split-l">
        <h2 class="sec"><span class="snum">1</span>원점 잡기 <small id="homing-note"></small></h2>
        <div id="homing"></div>
        <h2 class="sec"><span class="snum">2</span>움직이기</h2>
        <div id="gohome"></div>
        <div id="angles"></div>
      </div>
      <div class="split-r">
        <div class="card v3d-card">
          <h3>3D <span class="legend"><b>진한 팔</b> = 지금 · <span style="color:#2f66d0;font-weight:700">파란 반투명</span> = 보낼 목표</span></h3>
          <div class="v3d" id="v3d-angle"></div>
          <div class="note" id="v3d-angle-note"></div>
        </div>
      </div>
    </div>
  </section>
  <!-- 3. 역기구학 -->
  <section class="page" id="page-ik" data-tab="ik">
    <div class="split">
      <div class="split-l">
        <div id="svc-ik"></div>
        <div id="handik"></div>
      </div>
      <div class="split-r">
        <div class="card v3d-card">
          <h3>3D 궤적 <span class="legend"><span style="color:#ea580c;font-weight:700">주황</span> 큐브 · <span style="color:#16a34a;font-weight:700">초록</span> 놓을 자리 · <span style="color:#a855f7;font-weight:700">보라</span> 비전</span></h3>
          <div class="v3d" id="v3d-ik"></div>
          <div id="traj-ctl"></div>
        </div>
      </div>
    </div>
  </section>
  <!-- 4. 강화학습 (정책으로 집기, 시뮬 전용) — 내용은 rl.js 가 처음 열 때 채운다 -->
  <section class="page" id="page-rl" data-tab="rl" hidden></section>
  <!-- 휴대폰 카메라 탭: 내용·탭 버튼은 전부 static/phone.js 가 만든다 -->
  <section class="page" id="page-phone" data-tab="phone" hidden></section>
  <!-- 탑 쌓기 탭은 2026-11-25 없앰 (사용자). stack.js·stack_api.py 는 저장소에 남아 있지만 읽지 않는다 -->
  <details class="foot"><summary>정보</summary><div id="foot"></div></details>
</main>
<div class="toasts" id="toasts"></div>
<script src="/static/app.js"></script>
<script src="/static/direct.js"></script>
<script src="/static/rl.js"></script><!-- 강화학습 탭 (우리 것: JaxRL.mount, rl_run.py·rl_worker.py) -->
<script type="module" src="/static/viewer.js"></script>
<script src="/static/live.js"></script><!-- 큐브 실시간 인식 (휴대폰·탑 쌓기 탭이 같이 씀) -->
<script src="/static/phone.js"></script><!-- 휴대폰 카메라 탭 -->
<script src="/static/record.js"></script><!-- 실행 기록 (위 칩 + 연결 탭 맨 아래) -->
</body>
</html>
